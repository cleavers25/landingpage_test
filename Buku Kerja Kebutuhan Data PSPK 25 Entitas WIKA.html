van pada kolom Status beserta alasan singkat.","<b>Baris berlatar kuning adalah CONTOH format,</b> bukan data entitas ini. Ganti dengan angka sebenarnya, lalu hapus barisnya sebelum worksheet dijadikan lampiran resmi.","<b>Periode isian adalah Tahun Buku FY2026</b> yaitu 1 Januari sampai 31 Desember 2026, kecuali butir tertentu meminta periode lain.","<b>Mata uang Rupiah dan satuan juta,</b> mengikuti laporan keuangan entitas. Paragraf 24 PSPK 1 mewajibkan mata uang yang sama dengan laporan keuangan.","<b>Angka yang juga muncul di laporan keuangan</b> — pendapatan, aset, belanja modal, beban, provisi — wajib dapat direkonsiliasi. Tulis selisih dan penjelasannya pada kolom Keterangan.","<b>Setiap angka emisi wajib membawa tiga hal:</b> data aktivitas, faktor emisi beserta sumbernya, dan metode perhitungan. Tanpa ketiganya angka tidak dapat diverifikasi.","<b>Cakupan 1 dan Cakupan 2 dilaporkan terpisah</b> antara entitas terkonsolidasi dan investee lain, sesuai PSPK 2 paragraf 29(a)(iv).","<b>Untuk KSO:</b> data dilaporkan penuh karena dikonsolidasi 100 persen di laporan keuangan, disertai catatan metode alokasi kepada mitra konsorsium.","<b>Kolom Sumber Data</b> diisi nama modul SAP bila tersedia. Bila manual, tulis nama berkas dan unit pemiliknya agar penagihan data berikutnya jelas.","<b>Kolom Status hanya boleh empat nilai:</b> Siap, Proses, Belum, atau Tidak Relevan. Nilai lain akan menyulitkan rekapitulasi tingkat grup.","<b>Kolom PIC diisi nama orang dan jabatan,</b> bukan nama unit saja. Penagihan data memerlukan pihak yang dapat dimintai keterangan.","<b>Batas waktu internal (usulan, perlu ditetapkan Holding):</b> paket data entitas diserahkan paling lambat 31 Januari 2027 agar tersedia waktu konsolidasi dan verifikasi sebelum laporan FY2027 terbit."]}</script>
<script>
var DATA = null, STATE = {}, ACTIVE = 'idx';
var COLS = ['No','Kelompok','Butir Data yang Harus Disiapkan','Rujukan PSPK / Peta Data','Satuan / Format Isian','Sumber Data (modul / manual)','Nilai / Isian','Keterangan & Cara Hitung','PIC (nama & jabatan)','Status'];
var EDITCOL = [6,7,8,9];
var STATUS = ['Siap','Proses','Belum','Tidak Relevan'];

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){if(n==null||isNaN(n))return '—';return Number(n).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function showErr(e){
  var d=el('div','err');d.textContent='Dashboard tidak dapat dirender: '+(e&&e.message?e.message:e)+'\n\nPastikan blok data (prova-snapshot) berisi JSON yang valid dan memakai tanda kutip ganda hanya sebagai pemisah nilai.';
  document.getElementById('main').innerHTML='';document.getElementById('main').appendChild(d);
}
function keyOf(kode,id,col){return kode+'#'+id+'#'+col;}
function getV(kode,id,col){return STATE[keyOf(kode,id,col)];}
function setV(kode,id,col,v){STATE[keyOf(kode,id,col)]=v;}

function itemsFor(ent){
  var tg=ent.tg.split(',');
  var out=[];
  for(var i=0;i<DATA.cat.length;i++){
    var it=DATA.cat[i];
    if(it[6]==='ALL'){out.push(it);continue;}
    var tags=it[6].split(','),hit=false;
    for(var a=0;a<tags.length;a++){if(tg.indexOf(tags[a])>=0){hit=true;break;}}
    if(hit)out.push(it);
  }
  return out;
}
function exRow(ent){return DATA.ex[ent.arch];}
function exNote(ent){return DATA.exNote[ent.arch];}

function buildRows(ent){
  var items=itemsFor(ent), rows=[], lastG=null;
  var ex=exRow(ent);
  rows.push({id:'EX',grp:'CONTOH',item:ex[1],ref:ex[2],sat:ex[3],src:ex[4],vals:[ex[5],ex[6],ex[7],ex[8]],isEx:true});
  for(var i=0;i<items.length;i++){
    var it=items[i];
    rows.push({id:it[0],grp:it[1],item:it[2],ref:it[3],sat:it[4],src:it[5],vals:['','','',''],isEx:false,gfirst:(it[1]!==lastG)});
    lastG=it[1];
  }
  return rows;
}
function progress(ent){
  var rows=buildRows(ent),filled=0,n=0;
  for(var i=0;i<rows.length;i++){
    if(rows[i].isEx)continue;
    n++;
    var v=getV(ent.kode,rows[i].id,9);
    if(v && String(v).trim()!=='')filled++;
  }
  return {filled:filled,total:n};
}

function renderTabs(){
  var t=document.getElementById('tabs');t.innerHTML='';
  var b=el('button','tab'+(ACTIVE==='idx'?' on':''),'00 · Petunjuk Umum');
  b.onclick=function(){ACTIVE='idx';render();};t.appendChild(b);
  for(var i=0;i<DATA.ent.length;i++){
    var e=DATA.ent[i],p=progress(e);
    var x=el('button','tab'+(ACTIVE===e.kode?' on':''));
    x.innerHTML=esc(e.kode)+'<span class="pg">'+p.filled+'/'+p.total+'</span>';
    x.title=esc(e.name);
    (function(k){x.onclick=function(){ACTIVE=k;render();};})(e.kode);
    t.appendChild(x);
  }
}

function renderIndex(){
  var f=el('div','card');
  f.appendChild(el('h2',null,'Cara memakai buku kerja ini'));
  var p=el('p','sub','Setiap entitas memiliki satu worksheet sendiri. Worksheet berisi daftar butir data yang wajib disiapkan entitas untuk penyusunan laporan PSPK 1 dan PSPK 2 Holding tahun pelaporan 2027, satu baris contoh pengisian, dan petunjuk pengisian di bagian bawah.');
  f.appendChild(p);
  var g=el('div');g.style.marginTop='12px';
  var lbl=['H · Holding','C · Konstruksi / proyek','S · KSO','P · Paparan aset fisik besar','E · Properti / gedung','T · Hotel & pariwisata','M · Produksi / manufaktur','W · Pengelolaan air','R · Jalan tol','V · Pembangkit & energi','N · Entitas baru, baseline belum ada'];
  for(var i=0;i<lbl.length;i++){g.appendChild(el('span','gk',esc(lbl[i])));}
  f.appendChild(el('div',null,'<div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--abu);margin-top:10px">Penanda profil entitas yang menentukan butir mana yang muncul</div>')).appendChild(g);
  document.getElementById('main').appendChild(f);

  var c=el('div','card');
  c.appendChild(el('h2',null,'Daftar 25 Entitas dan Jumlah Butir Kebutuhannya'));
  var tb=el('table','idx'),th='<thead><tr><th>No</th><th>Nama Entitas</th><th>Worksheet</th><th>Level</th><th>Induk Langsung</th><th>% Kepemilikan</th><th>Aset (Rp miliar)</th><th>Bidang Usaha</th><th>Butir</th><th>Terisi</th></tr></thead>';
  var body='<tbody>';var tot=0,ast=0;
  for(var j=0;j<DATA.ent.length;j++){
    var e=DATA.ent[j],pr=progress(e);tot+=pr.total;ast+=(e.asset||0);
    body+='<tr><td class="num">'+e.no+'</td><td><b>'+esc(e.name)+'</b></td><td>'+esc(e.kode)+'</td><td>'+esc(e.level)+'</td><td>'+esc(e.parent)+'</td><td class="num">'+esc(e.pct)+'</td><td class="num">'+fmt(e.asset)+'</td><td>'+esc(e.bidang)+'</td><td class="num">'+pr.total+'</td><td class="num">'+pr.filled+'</td></tr>';
  }
  body+='<tr><td colspan="8"><b>Total — 25 entitas</b></td><td class="num"><b>'+tot+'</b></td><td class="num">—</td></tr>';
  body+='<tr><td colspan="8">Aset lingkup Tahap 1 (Rp miliar, sebelum eliminasi)</td><td class="num" colspan="2"><b>'+fmt(ast)+'</b></td></tr>';
  body+='</tbody>';
  tb.innerHTML=th+body;c.appendChild(tb);
  c.appendChild(el('div','legend','Butir = jumlah baris kebutuhan data pada worksheet entitas tersebut. Jumlahnya berbeda antar entitas karena butir ditapis sesuai profil aktivitas — entitas konstruksi tidak ditagih data perhotelan, entitas KSO tidak ditagih analisis skenario Holding.'));
  document.getElementById('main').appendChild(c);

  var h=el('div','hint');
  h.appendChild(el('h3',null,'Petunjuk Umum (berlaku untuk seluruh worksheet)'));
  var ol=el('ol');
  for(var k=0;k<DATA.petunjuk.length;k++){ol.appendChild(el('li',null,DATA.petunjuk[k]));}
  h.appendChild(ol);
  document.getElementById('main').appendChild(h);
}

function renderEntity(ent){
  var rows=buildRows(ent),pr=progress(ent);
  var c=el('div','card');
  c.appendChild(el('h2',null,esc(ent.no+'. '+ent.name)));
  c.appendChild(el('p','sub',esc(ent.bidang)+' · '+esc(ent.level)));
  var ig=el('div','idgrid');
  var boxes=[['Kode worksheet',ent.kode],['Induk langsung',ent.parent],['Kepemilikan',ent.pct+'%'],['Aset (Rp miliar)',fmt(ent.asset)],['Profil data',ent.tg],['Butir dibutuhkan',pr.total+' butir']];
  for(var i=0;i<boxes.length;i++){
    var b=el('div','idbox');b.innerHTML='<div class="k">'+esc(boxes[i][0])+'</div><div class="v">'+esc(String(boxes[i][1]))+'</div>';ig.appendChild(b);
  }
  c.appendChild(ig);
  var pb=el('div','bar');var fill=el('i');fill.style.width=(pr.total?Math.round(pr.filled/pr.total*100):0)+'%';pb.appendChild(fill);
  c.appendChild(el('div',null,'<div style="font-size:11.5px;color:var(--abu);margin-top:10px">Kemajuan pengisian worksheet ini: <b>'+pr.filled+' dari '+pr.total+'</b> butir telah diberi status</div>')).appendChild(pb);
  if(ent.note){var nb=el('div','hint');nb.style.borderStyle='solid';nb.style.background='var(--hijau-muda)';nb.innerHTML='<b>Catatan entitas:</b> '+ent.note;c.appendChild(nb);}
  document.getElementById('main').appendChild(c);

  var w=el('div','card');w.style.padding='0';w.style.overflow='auto';
  var t=el('table','dt');
  var thead='<thead><tr>';for(var a=0;a<COLS.length;a++){thead+='<th>'+esc(COLS[a])+'</th>';}thead+='</tr></thead>';
  var q=(document.getElementById('q').value||'').toLowerCase();
  var tb='<tbody>';
  for(var r=0;r<rows.length;r++){
    var x=rows[r];
    if(q && (x.item+' '+x.grp+' '+x.ref+' '+x.src).toLowerCase().indexOf(q)<0 && !x.isEx)continue;
    tb+='<tr class="'+(x.isEx?'ex':'')+'">';
    tb+='<td class="'+(x.isEx?'tag':'idc')+'">'+(x.isEx?'CONTOH':esc(x.id))+'</td>';
    tb+='<td class="grp">'+esc(x.grp)+'</td>';
    tb+='<td'+(x.isEx?' style="font-style:normal"':'')+'>'+esc(x.item)+'</td>';
    tb+='<td>'+esc(x.ref)+'</td>';
    tb+='<td>'+esc(x.sat)+'</td>';
    tb+='<td>'+esc(x.src)+'</td>';
    for(var cc=0;cc<4;cc++){
      var col=6+cc, val=x.isEx?x.vals[cc]:(getV(ent.kode,x.id,col)||'');
      var cls=col===9?'ed stat':'ed';
      tb+='<td class="'+cls+'" contenteditable="true" data-k="'+esc(ent.kode)+'" data-i="'+esc(x.id)+'" data-c="'+col+'">'+esc(val)+'</td>';
    }
    tb+='</tr>';
  }
  tb+='</tbody>';
  t.innerHTML=thead+tb;w.appendChild(t);
  document.getElementById('main').appendChild(w);

  var cells=w.querySelectorAll('td.ed');
  for(var z=0;z<cells.length;z++){
    cells[z].addEventListener('blur',function(){
      var v=this.textContent.trim();
      setV(this.getAttribute('data-k'),this.getAttribute('data-i'),Number(this.getAttribute('data-c')),v);
    });
  }
  if(!x_isEx(rows)){/* noop */}
  var h=el('div','hint');
  h.appendChild(el('h3',null,'Petunjuk Pengisian — Worksheet '+esc(ent.kode)));
  var ol=el('ol');
  for(var p2=0;p2<DATA.petunjuk.length;p2++){ol.appendChild(el('li',null,DATA.petunjuk[p2]));}
  h.appendChild(ol);
  var en=el('div','ent');en.innerHTML='<b>Catatan khusus entitas ini:</b> '+esc(exNote(ent));
  h.appendChild(en);
  var st=el('div','ent');st.style.background='var(--kuning)';st.innerHTML='<b>Baris CONTOH:</b> nilai pada baris berlatar kuning adalah contoh format pengisian, bukan data entitas ini. Timbang ulang dengan angka sebenarnya, lalu hapus barisnya sebelum worksheet dipakai sebagai lampiran resmi.';
  h.appendChild(st);
  document.getElementById('main').appendChild(h);
}
function x_isEx(rows){return rows&&rows.length>0;}

function render(){
  document.getElementById('main').innerHTML='';
  renderTabs();
  if(ACTIVE==='idx'){renderIndex();return;}
  var ent=null;
  for(var i=0;i<DATA.ent.length;i++){if(DATA.ent[i].kode===ACTIVE){ent=DATA.ent[i];break;}}
  if(!ent){renderIndex();return;}
  renderEntity(ent);
}

/* ---------- Ekspor ---------- */
function xs(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sheetName(s){return String(s).replace(/[\[\]\:\*\?\/\\]/g,' ').substring(0,31);}
function cell(v,st){return '<Cell ss:StyleID="'+(st||'sT')+'"><Data ss:Type="String">'+xs(v)+'</Data></Cell>';}
function cellN(v,st){if(v===''||v==null||isNaN(v))return cell('',st);return '<Cell ss:StyleID="'+(st||'sN')+'"><Data ss:Type="Number">'+v+'</Data></Cell>';}
function rowx(cells){return '<Row>'+cells.join('')+'</Row>';}

function xlsAll(){
  var out='<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>'+
  '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
  '<Styles>'+
  '<Style ss:ID="Default" ss:Name="Normal"><Font ss:FontName="Calibri" ss:Size="10"/><Alignment ss:Vertical="Top" ss:WrapText="1"/></Style>'+
  '<Style ss:ID="sT"><Font ss:FontName="Calibri" ss:Size="10"/><Alignment ss:Vertical="Top" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#DDE6E0"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#DDE6E0"/></Borders></Style>'+
  '<Style ss:ID="sN" ss:Parent="sT"><Alignment ss:Horizontal="Right" ss:Vertical="Top"/></Style>'+
  '<Style ss:ID="sTitle"><Font ss:FontName="Calibri" ss:Size="14" ss:Bold="1" ss:Color="#0E5C38"/></Style>'+
  '<Style ss:ID="sSub"><Font ss:FontName="Calibri" ss:Size="10" ss:Color="#5B6B62"/></Style>'+
  '<Style ss:ID="sHdr"><Font ss:FontName="Calibri" ss:Size="10" ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#1A7A4C" ss:Pattern="Solid"/><Alignment ss:Vertical="Center" ss:WrapText="1"/></Style>'+
  '<Style ss:ID="sEx"><Interior ss:Color="#FFF6E0" ss:Pattern="Solid"/><Font ss:FontName="Calibri" ss:Size="10" ss:Italic="1"/><Alignment ss:Vertical="Top" ss:WrapText="1"/></Style>'+
  '<Style ss:ID="sExN" ss:Parent="sEx"><Alignment ss:Horizontal="Right" ss:Vertical="Top"/></Style>'+
  '<Style ss:ID="sGrp"><Font ss:FontName="Calibri" ss:Size="10" ss:Bold="1" ss:Color="#0E5C38"/></Style>'+
  '<Style ss:ID="sH2"><Font ss:FontName="Calibri" ss:Size="11" ss:Bold="1" ss:Color="#0E5C38"/></Style>'+
  '</Styles>';

  /* Sheet 00: Petunjuk Umum + daftar entitas */
  var idx='<Worksheet ss:Name="00 Petunjuk Umum"><div class="fit-wrap"><Table ss:DefaultRowHeight="15">';
  idx+='<Column ss:Width="34"/><Column ss:Width="250"/><Column ss:Width="150"/><Column ss:Width="130"/><Column ss:Width="200"/><Column ss:Width="80"/><Column ss:Width="90"/><Column ss:Width="200"/>';
  idx+=rowx([cell('BUKU KERJA KEBUTUHAN DATA PSPK — 25 ENTITAS WIKA (TAHAP 1)','sTitle')]);
  idx+=rowx([cell('WTON dan WEGE beserta subtree-nya dikecualikan. Disusun 21 Oktober 2026. Bukan opini audit.','sSub')]);
  idx+=rowx([cell('')]);
  idx+=rowx([cell('DAFTAR ENTITAS','sH2')]);
  idx+=rowx([cell('No','sHdr'),cell('Nama Entitas','sHdr'),cell('Worksheet','sHdr'),cell('Level','sHdr'),cell('Induk Langsung','sHdr'),cell('% Kepemilikan','sHdr'),cell('Aset (Rp miliar)','sHdr'),cell('Bidang Usaha','sHdr')]);
  for(var i=0;i<DATA.ent.length;i++){
    var e=DATA.ent[i];
    idx+=rowx([cell(String(e.no)),cell(e.name),cell(e.kode),cell(e.level),cell(e.parent),cell(e.pct),cellN(e.asset),cell(e.bidang)]);
  }
  idx+=rowx([cell('')]);
  idx+=rowx([cell('PETUNJUK UMUM','sH2')]);
  for(var j=0;j<DATA.petunjuk.length;j++){idx+=rowx([cell(String(j+1)),cell(DATA.petunjuk[j].replace(/<[^>]+>/g,''))]);}
  idx+='</Table></div></Worksheet>';
  out+=idx;

  /* Sheet per entitas */
  for(var s=0;s<DATA.ent.length;s++){
    var ent=DATA.ent[s],rows=buildRows(ent);
    var sh='<Worksheet ss:Name="'+xs(sheetName(ent.kode))+'"><div class="fit-wrap"><Table ss:DefaultRowHeight="15">';
    sh+='<Column ss:Width="34"/><Column ss:Width="120"/><Column ss:Width="300"/><Column ss:Width="150"/><Column ss:Width="150"/><Column ss:Width="180"/><Column ss:Width="130"/><Column ss:Width="300"/><Column ss:Width="140"/><Column ss:Width="90"/>';
    sh+=rowx([cell('KEBUTUHAN DATA PSPK — '+ent.name,'sTitle')]);
    sh+=rowx([cell('Worksheet '+ent.kode+' · '+ent.level+' · '+ent.bidang,'sSub')]);
    sh+=rowx([cell('Induk: '+ent.parent+' · Kepemilikan: '+ent.pct+'% · Aset: '+fmt(ent.asset)+' Rp miliar','sSub')]);
    sh+=rowx([cell('')]);
    sh+=rowx([cell('DAFTAR BUTIR DATA YANG HARUS DISIAPKAN','sH2')]);
    var hc=[];for(var c2=0;c2<COLS.length;c2++){hc.push(cell(COLS[c2],'sHdr'));}
    sh+=rowx(hc);
    for(var r=0;r<rows.length;r++){
      var x=rows[r],st=x.isEx?'sEx':'sT',cells=[];
      cells.push(cell(x.isEx?'CONTOH':x.id, x.isEx?'sEx':'sT'));
      cells.push(cell(x.grp, x.isEx?'sEx':'sGrp'));
      cells.push(cell(x.item,st));cells.push(cell(x.ref,st));cells.push(cell(x.sat,st));cells.push(cell(x.src,st));
      for(var v=0;v<4;v++){
        var col=6+v, val=x.isEx?x.vals[v]:(getV(ent.kode,x.id,col)||'');
        cells.push(cell(val, x.isEx?'sEx':'sT'));
      }
      sh+=rowx(cells);
    }
    sh+=rowx([cell('')]);
    sh+=rowx([cell('PETUNJUK PENGISIAN','sH2')]);
    for(var p3=0;p3<DATA.petunjuk.length;p3++){sh+=rowx([cell(String(p3+1)),cell(DATA.petunjuk[p3].replace(/<[^>]+>/g,''))]);}
    sh+=rowx([cell('')]);
    sh+=rowx([cell('CATATAN KHUSUS ENTITAS INI','sH2')]);
    sh+=rowx([cell(''),cell(exNote(ent))]);
    sh+=rowx([cell(''),cell('Baris CONTOH hanyalah illustrasi format — ganti dengan data entitas ini dan hapus barisnya sebelum dijadikan lampiran resmi.')]);
    sh+='</Table></div></Worksheet>';
    out+=sh;
  }
  out+='</Workbook>';
  return out;
}
function download(name,mime,text){
  try{
    var blob=new Blob([text],{type:mime});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},800);
    return true;
  }catch(e){alert('Unduhan diblokir sandbox: '+e.message);return false;}
}
function csvActive(){
  if(ACTIVE==='idx'){return 'No;Nama Entitas;Level;Induk;Kepemilikan;Aset Rp miliar\n'+DATA.ent.map(function(e){return [e.no,'"'+e.name+'"',e.level,'"'+e.parent+'"',e.pct,e.asset].join(';');}).join('\n');}
  var ent=null;for(var i=0;i<DATA.ent.length;i++){if(DATA.ent[i].kode===ACTIVE)ent=DATA.ent[i];}
  if(!ent)return '';
  var rows=buildRows(ent),lines=[];
  lines.push('KEBUTUHAN DATA PSPK - '+ent.name);
  lines.push('Worksheet;'+ent.kode+';Level;'+ent.level+';Aset Rp miliar;'+fmt(ent.asset));
  lines.push(COLS.map(function(c){return '"'+c+'"';}).join(';'));
  for(var r=0;r<rows.length;r++){
    var x=rows[r],arr=[x.isEx?'CONTOH':x.id,x.grp,x.item,x.ref,x.sat,x.src];
    for(var v=0;v<4;v++){var col=6+v;arr.push(x.isEx?x.vals[v]:(getV(ent.kode,x.id,col)||''));}
    lines.push(arr.map(function(s){return '"'+String(s).replace(/"/g,'""')+'"';}).join(';'));
  }
  lines.push('');lines.push('PETUNJUK PENGISIAN');
  for(var p=0;p<DATA.petunjuk.length;p++){lines.push((p+1)+';"'+DATA.petunjuk[p].replace(/<[^>]+>/g,'').replace(/"/g,'""')+'"');}
  lines.push('CATATAN ENTITAS;"'+exNote(ent).replace(/"/g,'""')+'"');
  return lines.join('\n');
}
function collect(){
  var out={entries:[],meta:{generated:'2026-10-21',active:ACTIVE}};
  for(var i=0;i<DATA.ent.length;i++){
    var ent=DATA.ent[i],rows=buildRows(ent);
    for(var r=0;r<rows.length;r++){
      var x=rows[r];if(x.isEx)continue;
      var nilai=getV(ent.kode,x.id,6),ket=getV(ent.kode,x.id,7),pic=getV(ent.kode,x.id,8),stat=getV(ent.kode,x.id,9);
      if(!nilai&&!ket&&!pic&&!stat)continue;
      out.entries.push({kode:ent.kode,no:ent.no,item:x.id,butir:x.item,nilai:nilai||'',ket:ket||'',pic:pic||'',status:stat||''});
    }
  }
  return out;
}

/* ---------- Boot ---------- */
function boot(){
  try{
    var raw=document.getElementById('prova-snapshot').textContent||'{}';
    DATA=JSON.parse(raw);
  }catch(e){showErr(e);return;}
  if(!DATA||!DATA.ent||!DATA.ent.length||!DATA.cat||!DATA.ex){showErr(new Error('Snapshot belum berisi data entitas (key ent/cat/ex).'));return;}

  var ch=document.getElementById('chips');
  var chips=[DATA.ent.length+' entitas · 1 worksheet per entitas', (DATA.cat.length)+' butir dalam katalog kebutuhan', 'Periode isian: FY2026 · Laporan: FY2027', 'Tahap 1 — WTON & WEGE dikecualikan'];
  for(var i=0;i<chips.length;i++){var c=el('span','chip'+(i===3?' warn':''),esc(chips[i]));ch.appendChild(c);}

  document.getElementById('btnXls').onclick=function(){
    if(download('Buku Kerja Kebutuhan Data PSPK 25 Entitas WIKA.xls','application/vnd.ms-excel',xlsAll())){
      alert('File Excel berisi '+(DATA.ent.length+1)+' worksheet sudah diunduh. Buka di Microsoft Excel, lalu simpan sebagai .xlsx bila diperlukan.');
    }
  };
  document.getElementById('btnCsv').onclick=function(){
    download((ACTIVE==='idx'?'Daftar-Entitas':ACTIVE)+'.csv','text/csv;charset=utf-8','\ufeff'+csvActive());
  };
  document.getElementById('btnSend').onclick=function(){
    var d=collect();
    if(window.parent!==window){try{window.parent.postMessage({type:'prova:data',payload:d},'*');}catch(e){}}
    alert(d.entries.length===0
      ? 'Belum ada isian untuk dikirim. Isi kolom Nilai / PIC / Status pada worksheet terlebih dahulu.'
      : d.entries.length+' baris isian dikirim ke chat. Sampaikan pesan ke asisten agar data dibaca lewat html_get_data.');
  };
  document.getElementById('btnImp').onclick=function(){document.getElementById('fImp').click();};
  document.getElementById('fImp').onchange=function(){
    var f=this.files[0];if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var j=JSON.parse(fr.result);
        var arr=j.entries||j;
        for(var i=0;i<arr.length;i++){
          var e=arr[i];
          setV(e.kode,e.item,6,e.nilai);setV(e.kode,e.item,7,e.ket);setV(e.kode,e.item,8,e.pic);setV(e.kode,e.item,9,e.status);
        }
        render();
      }catch(err){alert('File JSON tidak valid: '+err.message);}
    };
    fr.readAsText(f);
  };
  document.getElementById('btnPrint').onclick=function(){window.print();};
  document.getElementById('q').addEventListener('input',function(){render();});

  document.getElementById('foot').innerHTML=DATA.footer||'';
  render();
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();}
</script>

function openClip(){

  }catch(e){}}
}
/* Reflow mobile: netralkan posisi absolut agar konten menumpuk rapi,
   bukan saling bertumpuk. Hanya berlaku di lebar <=640px. */
function unabs(){
  if((window.innerWidth||0)>640) return;
  var els=document.querySelectorAll('.page *,.slide *,.sheet *,.paper *,[data-page] *');
  for(var i=0;i<els.length;i++){try{
    var cs=getComputedStyle(els[i]);
    if(cs.position==='absolute'||cs.position==='fixed'){
      els[i].style.position='static';
      els[i].style.top='auto';els[i].style.left='auto';els[i].style.right='auto';els[i].style.bottom='auto';
      els[i].style.transform='none';
    }
  }catch(e){}}
}
function run(){openClip();unabs();}
